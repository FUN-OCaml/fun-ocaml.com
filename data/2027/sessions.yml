- slug: "chaufr"
  title: "Chaufr: Running a Lagos Startup on OCaml and a $3.50/Month Server"
  speakers: ["chukwuma"]
  kind: talk
  abstract: |
      Chaufr is a ride and chauffeur marketplace for Lagos, Nigeria: riders can book a standard ride, or book a vetted chauffeur to drive *their own car* for a few hours. 
      It is a real startup attempt, not a demo. Version 1 went to Y Combinator in January 2026 and was rejected. I rebuilt it from scratch, and version 2 launches publicly on 14 December 2026, timed for "Detty December", when the diaspora comes home and Lagos transport is at its most strained.

      The whole stack is OCaml: Dream, dream-html and htmx for the web, Caqti on PostgreSQL, Lwt, Argon2 and OpenTelemetry. Outbound email goes through ocaml-smtpd, an Eio-based mail server I patched upstream while deploying it. Everything, database included, runs on one 1 vCPU / 1 GB UpCloud server that costs $3.50 a month.

      Budget shaped every decision, so this talk is about how OCaml changes a startup's economics:

      - **Deployment without containers.** v1 shipped as a Docker image through Azure Container Registry to a managed PostgreSQL. Deploys took 15+ minutes, and the registry and database used about $16/month. v2 ships a stripped 16 MB native binary over rsync to one server that also hosts PostgreSQL. A deploy, including a backup and migrations, takes 42 seconds, and the app idles at about 12 MB of memory.
      - **Types as product rules.** The ride lifecycle is a variant where a completed trip cannot exist without a start time, and a session cookie stops working the moment its password changes.
      - **Migrations as code.** SQL files are generated into OCaml modules and applied by a systemd oneshot, so the app can never start against an old schema.
      - **War stories.** A blocking `Unix.sleep` inside an Eio fiber made verification emails arrive up to an hour late. A CAA DNS record blocked TLS. A bad deploy crash-looped 48 times.

      I'll close with real numbers from the first six weeks after launch: hosting cost per booking, chauffeur sign-ups and retention, and what I'd do differently.

      https://chaufr.invarware.com
